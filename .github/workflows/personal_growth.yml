name: 个人成长六站每日资讯

on:
  schedule:
    - cron: "7 0 * * *"
    - cron: "37 0 * * *"
    - cron: "7 1 * * *"
  workflow_dispatch:
    inputs:
      target_date:
        description: "处理日期（北京时间 YYYY-MM-DD；留空为前一日）"
        required: false
        type: string
      sources:
        description: "all 或逗号分隔的来源键"
        required: false
        default: "all"
        type: string
      dry_run:
        description: "运行AI但不写飞书"
        required: false
        default: false
        type: boolean
      collect_only:
        description: "只验证采集和正文，不调用AI和飞书"
        required: false
        default: false
        type: boolean
      force:
        description: "忽略完成标记并强制重跑（仍会查重）"
        required: false
        default: false
        type: boolean
      backfill_existing:
        description: "原地回填指定日期的已有记录，不新增"
        required: false
        default: false
        type: boolean
      max_articles:
        description: "最多处理文章数；0表示不限制"
        required: false
        default: "0"
        type: string
      ark_max_429_retries:
        description: "豆包429最大重试次数；诊断时可设0"
        required: false
        default: "4"
        type: string
      feishu_check_only:
        description: "只读检查飞书权限和字段"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: personal-growth-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
      FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
      ARK_MODEL: doubao-seed-2-0-mini-260215
      AI_WORKERS: "1"
      ARK_MIN_INTERVAL_SECONDS: "4"
      ARK_MAX_429_RETRIES: ${{ inputs.ark_max_429_retries || '4' }}
      ARK_429_CIRCUIT_LIMIT: "3"
      ARK_BACKOFF_SECONDS: "60,120,300,600"
      STATE_DB: .state/news_pipeline.sqlite
      MAX_RUNTIME_MINUTES: "280"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: python -m pip install -r requirements.txt

      - name: 确定目标日期
        id: target
        shell: bash
        run: |
          if [[ -n "${{ inputs.target_date }}" ]]; then
            target_date="${{ inputs.target_date }}"
          else
            target_date="$(TZ=Asia/Shanghai date -d yesterday +%F)"
          fi
          echo "date=$target_date" >> "$GITHUB_OUTPUT"
          if [[ "${{ inputs.backfill_existing }}" == "true" ]]; then
            mode="backfill"
          elif [[ "${{ inputs.dry_run }}" == "true" ]]; then
            mode="dry"
          else
            mode="daily"
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: 恢复分析断点
        id: analysis_state
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: news-state-${{ steps.target.outputs.date }}-${{ steps.target.outputs.mode }}-${{ github.run_id }}
          restore-keys: |
            news-state-${{ steps.target.outputs.date }}-${{ steps.target.outputs.mode }}-

      - name: 检查当日完成标记
        id: completed
        if: ${{ inputs.backfill_existing != true }}
        uses: actions/cache/restore@v4
        with:
          path: .daily-complete
          key: personal-growth-complete-${{ steps.target.outputs.date }}

      - name: 单元测试
        run: pytest -q

      - name: 执行每日任务
        id: run_task
        if: ${{ inputs.force == true || inputs.backfill_existing == true || steps.completed.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          args=(--sources "${{ inputs.sources || 'all' }}")
          args+=(--date "${{ steps.target.outputs.date }}")
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            args+=(--dry-run)
          fi
          if [[ "${{ inputs.collect_only }}" == "true" ]]; then
            args+=(--collect-only)
          fi
          if [[ "${{ inputs.backfill_existing }}" == "true" ]]; then
            args+=(--backfill-existing)
          fi
          if [[ "${{ inputs.max_articles || '0' }}" != "0" ]]; then
            args+=(--max-articles "${{ inputs.max_articles }}")
          fi
          if [[ "${{ inputs.feishu_check_only }}" == "true" ]]; then
            args=(--check-feishu)
          fi
          python main.py "${args[@]}"

      - name: 保存分析断点
        if: ${{ always() && steps.run_task.outcome != 'skipped' && inputs.feishu_check_only != true }}
        uses: actions/cache/save@v4
        with:
          path: .state
          key: news-state-${{ steps.target.outputs.date }}-${{ steps.target.outputs.mode }}-${{ github.run_id }}

      - name: 生成当日完成标记
        if: ${{ steps.run_task.outcome == 'success' && inputs.dry_run != true && inputs.collect_only != true && inputs.backfill_existing != true && inputs.feishu_check_only != true }}
        shell: bash
        run: |
          mkdir -p .daily-complete
          touch ".daily-complete/${{ steps.target.outputs.date }}"

      - name: 保存当日完成标记
        if: ${{ steps.run_task.outcome == 'success' && inputs.dry_run != true && inputs.collect_only != true && inputs.backfill_existing != true && inputs.feishu_check_only != true && steps.completed.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: .daily-complete
          key: personal-growth-complete-${{ steps.target.outputs.date }}

      - name: 保存运行报告
        if: ${{ always() && inputs.feishu_check_only != true }}
        uses: actions/upload-artifact@v4
        with:
          name: run-report-${{ github.run_id }}
          path: run-report.json
          if-no-files-found: warn

      - name: 写入任务摘要
        if: ${{ always() && inputs.feishu_check_only != true }}
        shell: bash
        run: |
          if [[ -f run-report.json ]]; then
            echo '## 个人成长资讯运行报告' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat run-report.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
