name: 个人成长五站每日资讯
run-name: 个人成长网站版 · ${{ inputs.target_date || '自动日期' }} · ${{ inputs.trigger_source || github.event_name }}

on:
  schedule:
    - cron: "22 0,1 * * *"
  workflow_dispatch:
    inputs:
      trigger_source:
        description: "触发来源：manual、feishu或其他标识"
        required: false
        default: "manual"
        type: string
      target_date:
        description: "处理日期（北京时间 YYYY-MM-DD；留空为前一日）"
        required: false
        type: string
      sources:
        description: "all=每日五站，或逗号分隔的来源键；ithome仅手动诊断"
        required: false
        default: "all"
        type: string
      dry_run:
        description: "运行AI但不写飞书"
        required: false
        default: false
        type: boolean
      collect_only:
        description: "只验证采集和正文，不调用AI和飞书"
        required: false
        default: false
        type: boolean
      force:
        description: "忽略完成标记并强制重跑（仍会查重）"
        required: false
        default: false
        type: boolean
      backfill_existing:
        description: "原地回填指定日期的已有记录，不新增"
        required: false
        default: false
        type: boolean
      max_articles:
        description: "最多处理文章数；0表示不限制"
        required: false
        default: "0"
        type: string
      ark_max_429_retries:
        description: "豆包429最大重试次数；诊断时可设0"
        required: false
        default: "4"
        type: string
      feishu_check_only:
        description: "只读检查飞书权限和字段"
        required: false
        default: false
        type: boolean
      backfill_daily_dates:
        description: "按发布日期回填日报日期，不调用AI"
        required: false
        default: false
        type: boolean
      write_cached_only:
        description: "只写入指定旧运行的AI缓存，不继续调用模型"
        required: false
        default: false
        type: boolean
      cached_state_run_id:
        description: "仅写缓存时使用的原运行ID"
        required: false
        default: ""
        type: string
      cached_is_complete:
        description: "旧缓存来自完整分析；写入成功后生成完整日报标记"
        required: false
        default: false
        type: boolean
      repair_missing_titles:
        description: "仅原地修复飞书空标题，不调用AI、不新增记录"
        required: false
        default: false
        type: boolean
      migrate_primary_titles:
        description: "将已恢复标题迁移到飞书首列主字段，不调用AI、不新增记录"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: personal-growth-daily
  cancel-in-progress: false

jobs:
  migrate-primary-titles:
    if: ${{ inputs.migrate_primary_titles == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
      PYTHONUNBUFFERED: "1"
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装依赖
        run: python -m pip install -r requirements.txt
      - name: 单元测试
        run: pytest -q
      - name: 迁移标题至飞书首列主字段
        run: python main.py --migrate-primary-titles
      - name: 保存主字段迁移报告
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: primary-title-migration-report-${{ github.run_id }}
          path: primary-title-migration-report.json
          if-no-files-found: warn

  repair-titles:
    if: ${{ inputs.repair_missing_titles == true && inputs.migrate_primary_titles != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
      PYTHONUNBUFFERED: "1"
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装依赖
        run: python -m pip install -r requirements.txt
      - name: 单元测试
        run: pytest -q
      - name: 原地修复空标题
        run: python main.py --repair-missing-titles
      - name: 保存标题修复报告
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: title-repair-report-${{ github.run_id }}
          path: title-repair-report.json
          if-no-files-found: warn
      - name: 写入任务摘要
        if: ${{ always() }}
        shell: bash
        run: |
          if [[ -f title-repair-report.json ]]; then
            echo '## 飞书空标题修复报告' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat title-repair-report.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

  run:
    if: ${{ inputs.repair_missing_titles != true && inputs.migrate_primary_titles != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
      FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
      ARK_MODEL: doubao-seed-2-0-mini-260215
      AI_WORKERS: "1"
      ARK_MIN_INTERVAL_SECONDS: "4"
      ARK_MAX_429_RETRIES: ${{ inputs.ark_max_429_retries || '4' }}
      ARK_429_CIRCUIT_LIMIT: "3"
      ARK_BACKOFF_SECONDS: "60,120,300,600"
      STATE_DB: .state/news_pipeline.sqlite
      MAX_RUNTIME_MINUTES: "280"
      PROGRESSIVE_WRITE_INTERVAL_MINUTES: "60"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: 确定目标日期
        id: target
        shell: bash
        run: |
          if [[ -n "${{ inputs.target_date }}" ]]; then
            target_date="${{ inputs.target_date }}"
          else
            target_date="$(TZ=Asia/Shanghai date -d yesterday +%F)"
          fi
          echo "date=$target_date" >> "$GITHUB_OUTPUT"
          if [[ "${{ inputs.write_cached_only }}" == "true" ]]; then
            mode="cached-write"
          elif [[ "${{ inputs.backfill_daily_dates }}" == "true" ]]; then
            mode="date-backfill"
          elif [[ "${{ inputs.backfill_existing }}" == "true" ]]; then
            mode="backfill"
          elif [[ "${{ inputs.dry_run }}" == "true" ]]; then
            mode="dry"
          else
            mode="daily"
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: 检查当日完成标记
        id: completed
        if: ${{ inputs.backfill_existing != true && inputs.backfill_daily_dates != true }}
        uses: actions/cache/restore@v4
        with:
          path: .daily-complete
          key: personal-growth-complete-${{ steps.target.outputs.date }}

      - name: 检查用户关闭标记
        id: closed
        if: ${{ inputs.backfill_existing != true && inputs.backfill_daily_dates != true && inputs.write_cached_only != true }}
        uses: actions/cache/restore@v4
        with:
          path: .daily-closed
          key: personal-growth-closed-${{ steps.target.outputs.date }}

      - name: 拉取代码
        if: ${{ inputs.write_cached_only == true || inputs.force == true || inputs.backfill_existing == true || inputs.backfill_daily_dates == true || (steps.completed.outputs.cache-hit != 'true' && steps.closed.outputs.cache-hit != 'true') }}
        uses: actions/checkout@v4

      - name: 安装 Python
        if: ${{ inputs.write_cached_only == true || inputs.force == true || inputs.backfill_existing == true || inputs.backfill_daily_dates == true || (steps.completed.outputs.cache-hit != 'true' && steps.closed.outputs.cache-hit != 'true') }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        if: ${{ inputs.write_cached_only == true || inputs.force == true || inputs.backfill_existing == true || inputs.backfill_daily_dates == true || (steps.completed.outputs.cache-hit != 'true' && steps.closed.outputs.cache-hit != 'true') }}
        run: python -m pip install -r requirements.txt

      - name: 恢复分析断点
        id: analysis_state
        if: ${{ inputs.write_cached_only != true && inputs.backfill_daily_dates != true && inputs.feishu_check_only != true && (inputs.force == true || inputs.backfill_existing == true || (steps.completed.outputs.cache-hit != 'true' && steps.closed.outputs.cache-hit != 'true')) }}
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: news-state-${{ steps.target.outputs.date }}-${{ steps.target.outputs.mode }}-${{ github.run_id }}
          restore-keys: |
            news-state-${{ steps.target.outputs.date }}-${{ steps.target.outputs.mode }}-

      - name: 恢复指定旧缓存
        id: cached_state
        if: ${{ inputs.write_cached_only == true }}
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: news-state-${{ steps.target.outputs.date }}-daily-${{ inputs.cached_state_run_id }}
          fail-on-cache-miss: true

      - name: 单元测试
        if: ${{ inputs.write_cached_only == true || inputs.force == true || inputs.backfill_existing == true || inputs.backfill_daily_dates == true || (steps.completed.outputs.cache-hit != 'true' && steps.closed.outputs.cache-hit != 'true') }}
        run: pytest -q

      - name: 执行每日任务
        id: run_task
        if: ${{ inputs.write_cached_only == true || inputs.force == true || inputs.backfill_existing == true || inputs.backfill_daily_dates == true || (steps.completed.outputs.cache-hit != 'true' && steps.closed.outputs.cache-hit != 'true') }}
        shell: bash
        run: |
          args=(--sources "${{ inputs.sources || 'all' }}")
          args+=(--date "${{ steps.target.outputs.date }}")
          args+=(--trigger-source "${{ inputs.trigger_source || github.event_name }}")
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            args+=(--dry-run)
          fi
          if [[ "${{ inputs.collect_only }}" == "true" ]]; then
            args+=(--collect-only)
          fi
          if [[ "${{ inputs.backfill_existing }}" == "true" ]]; then
            args+=(--backfill-existing)
          fi
          if [[ "${{ inputs.max_articles || '0' }}" != "0" ]]; then
            args+=(--max-articles "${{ inputs.max_articles }}")
          fi
          if [[ "${{ inputs.feishu_check_only }}" == "true" ]]; then
            args=(--check-feishu)
          fi
          if [[ "${{ inputs.backfill_daily_dates }}" == "true" ]]; then
            args=(--backfill-daily-dates)
          fi
          if [[ "${{ inputs.write_cached_only }}" == "true" ]]; then
            args=(--sources "${{ inputs.sources || 'all' }}" --date "${{ steps.target.outputs.date }}" --trigger-source "${{ inputs.trigger_source || github.event_name }}" --write-cached-only)
            if [[ "${{ inputs.cached_is_complete }}" == "true" ]]; then
              args+=(--cached-complete)
            fi
          fi
          python main.py "${args[@]}"

      - name: 验证完整日报
        id: validate
        if: ${{ steps.run_task.outcome == 'success' && inputs.write_cached_only != true && inputs.dry_run != true && inputs.collect_only != true && inputs.backfill_existing != true && inputs.backfill_daily_dates != true && inputs.feishu_check_only != true && (inputs.sources == '' || inputs.sources == 'all') && (inputs.max_articles == '' || inputs.max_articles == '0') }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("run-report.json").read_text(encoding="utf-8"))
          errors = []
          if report.get("partial"):
              errors.append("partial=true")
          if int(report.get("write_failed", 0)):
              errors.append(f"write_failed={report['write_failed']}")
          if int(report.get("pending_articles", 0)):
              errors.append(f"pending_articles={report['pending_articles']}")
          if not report.get("final_output_verified"):
              errors.append("final_output_verified=false")
          sources = report.get("sources") or {}
          expected_sources = {"huxiu", "sspai", "jiemian", "tmtpost", "36kr"}
          if set(sources) != expected_sources:
              errors.append(f"sources={sorted(sources)}")
          incomplete = [name for name, data in sources.items() if not data.get("coverage_complete")]
          if incomplete:
              errors.append("coverage_incomplete=" + ",".join(incomplete))
          if int(report.get("selected", 0)):
              minimum = int(report.get("summary_char_min", 0))
              maximum = int(report.get("summary_char_max", 0))
              if minimum < 300 or maximum > 500:
                  errors.append(f"summary_chars={minimum}-{maximum}")
          if errors:
              raise SystemExit("完整日报验收失败：" + "; ".join(errors))
          print("完整日报验收通过")
          PY

      - name: 验证完整缓存恢复
        id: validate_cached
        if: ${{ steps.run_task.outcome == 'success' && inputs.write_cached_only == true && inputs.cached_is_complete == true }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("run-report.json").read_text(encoding="utf-8"))
          errors = []
          if report.get("partial"):
              errors.append("partial=true")
          if report.get("truncated_by_user"):
              errors.append("truncated_by_user=true")
          if int(report.get("filter_calls", 0)) or int(report.get("summary_calls", 0)):
              errors.append("AI调用不为0")
          if int(report.get("write_failed", 0)):
              errors.append(f"write_failed={report['write_failed']}")
          if int(report.get("pending_articles", 0)):
              errors.append(f"pending_articles={report['pending_articles']}")
          if not report.get("final_output_verified"):
              errors.append("final_output_verified=false")
          sources = report.get("sources") or {}
          expected_sources = {"huxiu", "sspai", "jiemian", "tmtpost", "36kr"}
          if set(sources) != expected_sources:
              errors.append(f"sources={sorted(sources)}")
          incomplete = [name for name, data in sources.items() if not data.get("coverage_complete")]
          if incomplete:
              errors.append("coverage_incomplete=" + ",".join(incomplete))
          if int(report.get("selected", 0)):
              minimum = int(report.get("summary_char_min", 0))
              maximum = int(report.get("summary_char_max", 0))
              if minimum < 300 or maximum > 500:
                  errors.append(f"summary_chars={minimum}-{maximum}")
          if errors:
              raise SystemExit("完整缓存恢复验收失败：" + "; ".join(errors))
          print("完整缓存恢复验收通过")
          PY

      - name: 保存分析断点
        if: ${{ always() && inputs.write_cached_only != true && steps.run_task.outcome != 'skipped' && inputs.feishu_check_only != true && inputs.backfill_daily_dates != true }}
        uses: actions/cache/save@v4
        with:
          path: .state
          key: news-state-${{ steps.target.outputs.date }}-${{ steps.target.outputs.mode }}-${{ github.run_id }}

      - name: 生成当日完成标记
        if: ${{ steps.validate.outcome == 'success' || steps.validate_cached.outcome == 'success' }}
        shell: bash
        run: |
          mkdir -p .daily-complete
          touch ".daily-complete/${{ steps.target.outputs.date }}"

      - name: 保存当日完成标记
        if: ${{ (steps.validate.outcome == 'success' || steps.validate_cached.outcome == 'success') && steps.completed.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: .daily-complete
          key: personal-growth-complete-${{ steps.target.outputs.date }}

      - name: 生成用户关闭标记
        if: ${{ steps.run_task.outcome == 'success' && inputs.write_cached_only == true && inputs.cached_is_complete != true }}
        shell: bash
        run: |
          mkdir -p .daily-closed
          touch ".daily-closed/${{ steps.target.outputs.date }}"

      - name: 保存用户关闭标记
        if: ${{ steps.run_task.outcome == 'success' && inputs.write_cached_only == true && inputs.cached_is_complete != true }}
        uses: actions/cache/save@v4
        with:
          path: .daily-closed
          key: personal-growth-closed-${{ steps.target.outputs.date }}

      - name: 保存运行报告
        if: ${{ always() && inputs.feishu_check_only != true && inputs.backfill_daily_dates != true }}
        uses: actions/upload-artifact@v4
        with:
          name: run-report-${{ github.run_id }}
          path: run-report.json
          if-no-files-found: warn

      - name: 写入任务摘要
        if: ${{ always() && inputs.feishu_check_only != true && inputs.backfill_daily_dates != true }}
        shell: bash
        run: |
          if [[ -f run-report.json ]]; then
            echo '## 个人成长资讯运行报告' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat run-report.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
