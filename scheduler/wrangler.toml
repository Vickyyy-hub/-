name = "personal-growth-scheduler"
main = "src/worker.mjs"
compatibility_date = "2026-08-13"
workers_dev = true

[observability]
enabled = true
head_sampling_rate = 1

[triggers]
crons = ["7 0 * * *", "37 0 * * *", "7 1 * * *", "7 4 * * *", "17 0,1,4,8,12 * * *"]

[vars]
GITHUB_OWNER = "Vickyyy-hub"
GITHUB_REPO = "-"
GITHUB_WORKFLOW = "personal_growth.yml"
GITHUB_WECHAT_WORKFLOW = "wechat_growth.yml"
GITHUB_CROSS_BORDER_WORKFLOW = "cross_border_intelligence.yml"
GITHUB_REF = "main"
CROSS_BORDER_START_DATE = "2026-08-16"
