name: 欧洲与拉美跨境市场情报
run-name: 跨境市场情报 · ${{ inputs.job || 'auto' }} · ${{ inputs.target_date || '自动日期' }} · ${{ inputs.trigger_source || github.event_name }}

on:
  schedule:
    - cron: "0 0,4,8,12 * * *"
    - cron: "30 1 * * *"
    - cron: "0 2 * * 1"
    - cron: "0 3 1 * *"
  workflow_dispatch:
    inputs:
      job:
        description: "auto、sources、policy、demand、weekly、profiles或all"
        required: false
        default: "auto"
        type: string
      target_date:
        description: "北京时间日期 YYYY-MM-DD"
        required: false
        type: string
      trigger_source:
        description: "cloudflare或manual"
        required: false
        default: "manual"
        type: string
      dry_run:
        required: false
        default: false
        type: boolean
      collect_only:
        required: false
        default: false
        type: boolean
      check_feishu:
        required: false
        default: false
        type: boolean
      setup_feishu:
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: cross-border-market-intelligence
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
      FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
      FEISHU_APP_TOKEN: ${{ secrets.FEISHU_APP_TOKEN }}
      MERCADOLIBRE_ACCESS_TOKEN: ${{ secrets.MERCADOLIBRE_ACCESS_TOKEN }}
      EBAY_ACCESS_TOKEN: ${{ secrets.EBAY_ACCESS_TOKEN }}
      STATE_DB: .state/market_intelligence.sqlite
      GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
      TRIGGER_SOURCE: ${{ inputs.trigger_source || github.event_name }}
      PROGRESSIVE_WRITE_INTERVAL_MINUTES: "60"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: 恢复断点与趋势状态
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: cross-border-state-${{ github.run_id }}
          restore-keys: cross-border-state-
      - name: 离线测试
        run: python -m pytest -q
      - name: 验证配置来源
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path("pipeline.config.json").read_text(encoding="utf-8"))
          expected_sources = {key for key, value in config["sources"].items() if value.get("enabled") and value.get("mode") == "daily"}
          if not expected_sources:
              raise SystemExit("没有启用的每日来源")
          print(f"已配置 {len(expected_sources)} 个每日来源")
          PY
      - name: 执行任务
        id: execute
        shell: bash
        run: |
          args=(--job "${{ inputs.job || 'auto' }}" --trigger-source "${{ inputs.trigger_source || github.event_name }}")
          if [[ -n "${{ inputs.target_date }}" ]]; then args+=(--date "${{ inputs.target_date }}"); fi
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then args+=(--dry-run); fi
          if [[ "${{ inputs.collect_only }}" == "true" ]]; then args+=(--collect-only); fi
          if [[ "${{ inputs.check_feishu }}" == "true" ]]; then args=(--check-feishu); fi
          if [[ "${{ inputs.setup_feishu }}" == "true" ]]; then args=(--setup-feishu); fi
          python main.py "${args[@]}"
      - name: 验证完整日报
        id: validate
        if: ${{ !inputs.check_feishu && !inputs.setup_feishu && !inputs.dry_run && !inputs.collect_only }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("run-report.json").read_text(encoding="utf-8"))
          checks = {
              "partial": report.get("partial") is False,
              "coverage_complete": report.get("coverage_complete") is True,
              "pending_articles": report.get("pending_articles") == 0,
              "write_failed": report.get("write_failed") == 0,
              "final_output_verified": report.get("final_output_verified") is True,
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit("验收失败：" + ", ".join(failed))
          PY
      - name: 保存完成标记
        if: ${{ steps.validate.outcome == 'success' }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("run-report.json").read_text(encoding="utf-8"))
          if not report.get("completion_marker"):
              raise SystemExit("流水线未生成完成标记")
          Path(".state").mkdir(exist_ok=True)
          Path(".state/completed.json").write_text(json.dumps(report, ensure_ascii=False), encoding="utf-8")
          PY
      - name: 保存断点与报告
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .state
          key: cross-border-state-${{ github.run_id }}
      - name: 保存输出
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-border-intelligence-${{ github.run_id }}
          path: |
            output/
            run-report.json
          if-no-files-found: warn
